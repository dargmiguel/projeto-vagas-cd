# Configuração das fontes de dados para a camada Silver
sources:
  gupy:
    processor_module: "gupy_silver"
    bronze_path: "data/bronze/gupy"
    enabled: true

  # linkedin:
  #   processor_module: "processors.linkedin_silver"
  #   bronze_path: "data/bronze/linkedin"
  #   enabled: false

  # indeed:
  #   processor_module: "processors.indeed_silver"
